<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFC Card Reader - Apple Pay 후원 데모</title>

  <!-- 1. Apple Pay 공식 SDK -->
  <script src="https://applepay.cdn-apple.com/jssdk/v1/apple-pay-sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 450px;
      margin: 40px auto;
      padding: 24px;
      background-color: #f5f5f7;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }
    h2 {
      margin-top: 0;
      color: #1d1d1f;
      font-size: 22px;
    }
    .input-group {
      margin: 20px 0;
    }
    label {
      display: block;
      font-size: 14px;
      color: #6e6e73;
      margin-bottom: 8px;
      font-weight: 500;
    }
    input {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      border: 1px solid #d2d2d7;
      border-radius: 10px;
      outline: none;
      background: #fff;
    }
    input:focus {
      border-color: #0071e3;
    }
    
    .btn-container {
      margin-top: 20px;
      width: 100%;
      min-height: 50px;
    }

    /* 2. 애플 페이 버튼 가시성 보장 CSS */
    .custom-apple-pay-btn {
      width: 100%;
      height: 50px;
      background-color: #000;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background-color 0.2s;
    }
    .custom-apple-pay-btn:hover {
      background-color: #1a1a1a;
    }
    .custom-apple-pay-btn:active {
      background-color: #333;
    }

    .notice {
      margin-top: 20px;
      font-size: 13px;
      color: #86868b;
      line-height: 1.5;
      background: #ffffff;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #e5e5ea;
    }
  </style>
</head>
<body>

  <h2>프로젝트 후원하기</h2>
  
  <div class="input-group">
    <label for="amount">후원할 금액 (KRW)</label>
    <input type="number" id="amount" value="5000" min="1000" step="1000" placeholder="금액 입력">
  </div>

  <div class="btn-container">
    <!-- 렌더링 오류를 완벽히 방지하는 커스텀 Apple Pay 버튼 -->
    <button id="pay-button" class="custom-apple-pay-btn">
      <span>Pay로 후원하기</span>
    </button>
  </div>

  <div class="notice" id="env-notice">
    상태 확인 중...
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const payButton = document.getElementById("pay-button");
      const envNotice = document.getElementById("env-notice");

      // Apple Pay 지원 및 가능 여부 체크
      if (window.ApplePaySession && ApplePaySession.canMakePayments()) {
        envNotice.innerHTML = "✅ <b>현재 기기/브라우저는 Apple Pay 결제를 지원합니다.</b><br>버튼을 누르면 애플 공식 결제창이 호출됩니다.";
        envNotice.style.color = "#00875a";
      } else {
        envNotice.innerHTML = "⚠️ <b>안내:</b> 현재 환경은 Apple Pay 결제 실행을 지원하지 않습니다.<br>(iOS/macOS의 Safari 브라우저 및 지갑 앱 카드 등록 필요)";
        envNotice.style.color = "#b93815";
      }

      payButton.addEventListener("click", onApplePayButtonClicked);
    });

    function onApplePayButtonClicked() {
      const amountInput = document.getElementById("amount").value;

      if (!amountInput || amountInput <= 0) {
        alert("올바른 후원 금액을 입력해주세요.");
        return;
      }

      // Apple Pay 구동 지원 환경 체크
      if (!window.ApplePaySession) {
        alert("Apple Pay는 iOS 또는 macOS의 Safari 브라우저에서만 동작합니다.");
        return;
      }

      // 결제 요청 파라미터 (애플 공식 규격)
      const paymentRequest = {
        countryCode: 'KR',
        currencyCode: 'KRW',
        supportedNetworks: ['visa', 'masterCard', 'amex'],
        merchantCapabilities: ['supports3DS'],
        total: {
          label: 'NFC Card Reader 후원금',
          amount: amountInput.toString()
        }
      };

      try {
        const session = new ApplePaySession(3, paymentRequest);

        // 1) 가맹점 인증 (Merchant Validation)
        session.onmerchantvalidation = (event) => {
          console.log("Validation URL 요청받음:", event.validationURL);
          alert("데모 결제 호출 성공!\n\n(실제 상용화 시에는 서버에서 Merchant Validation 토큰을 발급받아 세션을 완료해야 결제가 진행됩니다.)");
        };

        // 2) 결제 승인 완료
        session.onpaymentauthorized = (event) => {
          session.completePayment({ status: ApplePaySession.STATUS_SUCCESS });
          alert(`${amountInput}원 후원 승인이 완료되었습니다!`);
        };

        // 3) 결제 취소
        session.oncancel = (event) => {
          console.log("사용자가 결제를 취소했습니다.");
        };

        // Apple Pay 시트/팝업 띄우기
        session.begin();

      } catch (error) {
        console.error("Apple Pay 세션 오류:", error);
        alert("Apple Pay 세션을 시작할 수 없습니다. (지갑 앱에 등록된 카드가 있는지 확인하세요)");
      }
    }
  </script>
</body>
</html>
