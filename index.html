<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Apple Pay 후원 테스트</title>
  <!-- 1. 애플 공식 CSS 버튼 라이브러리 로드 -->
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .input-group { margin-bottom: 15px; }
    input { padding: 8px; font-size: 16px; width: 150px; }
    
    /* 애플 공식 CSS 규격에 맞춘 결제 버튼 스타일ing */
    apple-pay-button {
      --apple-pay-button-width: 200px;
      --apple-pay-button-height: 45px;
      --apple-pay-button-border-radius: 5px;
      display: none; /* JS 지원 여부 확인 후 표시 */
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h2>프로젝트 후원하기</h2>
  
  <div class="input-group">
    <label for="amount">후원 금액 (KRW): </label>
    <input type="number" id="amount" value="5000" min="1000" step="1000">
  </div>

  <!-- Apple Pay 버튼 -->
  <apple-pay-button 
    id="pay-button" 
    buttonstyle="black" 
    type="donate" 
    locale="ko-KR">
  </apple-pay-button>

  <script src="https://applepay.cdn-apple.com/jssdk/v1/apple-pay-sdk.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const payButton = document.getElementById("pay-button");

      // 2. 현재 브라우저/기기가 Apple Pay를 지원하는지 확인
      if (window.ApplePaySession && ApplePaySession.canMakePayments()) {
        payButton.style.display = "inline-block";
      } else {
        alert("이 브라우저/기기는 Apple Pay를 지원하지 않습니다. (Safari 브라우저 필요)");
        return;
      }

      // 3. Apple Pay 버튼 클릭 이벤트 처리
      payButton.addEventListener("click", onApplePayButtonClicked);
    });

    function onApplePayButtonClicked() {
      const amountInput = document.getElementById("amount").value;
      if (!amountInput || amountInput <= 0) {
        alert("올바른 금액을 입력해주세요.");
        return;
      }

      // 4. 결제 요청 객체 구성 (공식 Demo 파라미터 규격)
      const paymentRequest = {
        countryCode: 'KR',
        currencyCode: 'KRW',
        supportedNetworks: ['visa', 'masterCard', 'amex'],
        merchantCapabilities: ['supports3DS'],
        total: {
          label: '프로젝트 후원금',
          amount: amountInput.toString()
        }
      };

      // 5. Apple Pay 세션 생성 (버전 3 이상)
      const session = new ApplePaySession(3, paymentRequest);

      // 6. 가맹점 검증 (Merchant Validation)
      // *실제 환경에서는 내 서버로 세션 URL을 전달해 Apple 서버 인증 토큰을 받아와야 함*
      session.onmerchantvalidation = async (event) => {
        console.log("Validation URL:", event.validationURL);
        
        /* 
        // [실제 백엔드 연동 예시]
        const merchantSession = await fetch('/api/apple-pay/validate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ validationURL: event.validationURL })
        }).then(res => res.json());

        session.completeMerchantValidation(merchantSession);
        */
      };

      // 7. 결제 승인 완료 처리
      session.onpaymentauthorized = (event) => {
        const paymentToken = event.payment.token;
        console.log("Apple Pay Payment Token Received:", paymentToken);

        // PG사(토스, Stripe 등)로 paymentToken을 넘겨 최종 결제 승인을 요청함
        
        // 데모 목적으로 성공 처리
        const result = { status: ApplePaySession.STATUS_SUCCESS };
        session.completePayment(result);
        alert(`Apple Pay ${amountInput}원 후원이 완료되었습니다!`);
      };

      // 8. 결제 취소 처리
      session.oncancel = (event) => {
        console.log("사용자가 결제를 취소했습니다.");
      };

      // 9. Apple Pay 결제창 팝업 실행
      session.begin();
    }
  </script>
</body>
</html>
