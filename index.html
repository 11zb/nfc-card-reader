<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFC Card Reader - 후원하기</title>

  <!-- 토스페이먼츠 SDK v2 (위젯용) 및 v1 (독립 가상계좌용) -->
  <script src="https://js.tosspayments.com/v2/standard"></script>
  <script src="https://js.tosspayments.com/v1/payment"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 480px;
      margin: 30px auto;
      padding: 24px;
      background-color: #f5f5f7;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      position: relative;
    }
    h2 { margin-top: 0; color: #1d1d1f; font-size: 22px; }
    
    .input-group { margin: 16px 0; }
    label { display: block; font-size: 14px; color: #6e6e73; margin-bottom: 6px; font-weight: 500; }
    input {
      width: 100%;
      padding: 12px 14px;
      font-size: 16px;
      border: 1px solid #d2d2d7;
      border-radius: 10px;
      outline: none;
      background: #fff;
    }
    input:focus { border-color: #0071e3; }
    
    #payment-method { margin-top: 15px; min-height: 180px; }
    #agreement { margin-top: 10px; }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 20px;
    }

    .submit-btn {
      width: 100%;
      height: 52px;
      background-color: #0064FF;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .submit-btn:hover { background-color: #0052cc; }
    .submit-btn:disabled { 
      background-color: #e5e5ea !important; 
      color: #86868b !important;
      cursor: not-allowed !important; 
    }

    /* 독립 가상계좌 후원 버튼 */
    .vaccount-btn {
      width: 100%;
      height: 48px;
      background-color: #ffffff;
      color: #1d1d1f;
      border: 1px solid #d2d2d7;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .vaccount-btn:hover {
      background-color: #f2f2f7;
      border-color: #86868b;
    }

    /* 감사 & 안내 모달 */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      z-index: 999;
      justify-content: center;
      align-items: center;
    }
    .modal-card {
      background: #ffffff;
      padding: 32px 24px;
      border-radius: 20px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      animation: popIn 0.3s ease-out;
    }
    .modal-icon { font-size: 48px; margin-bottom: 12px; }
    .modal-title { font-size: 20px; font-weight: 700; color: #1d1d1f; margin-bottom: 8px; }
    .modal-desc { font-size: 14px; color: #515154; line-height: 1.6; margin-bottom: 20px; text-align: left; background: #f9f9fb; padding: 14px; border-radius: 10px; border: 1px solid #e5e5ea; }
    .modal-close-btn {
      width: 100%;
      padding: 12px;
      background: #f2f2f7;
      color: #0071e3;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <h2>프로젝트 후원하기</h2>
  
  <!-- 1. 닉네임 입력 -->
  <div class="input-group">
    <label for="nickname">후원자 이름 / 닉네임</label>
    <input type="text" id="nickname" placeholder="닉네임을 입력해주세요" value="익명 후원자">
  </div>

  <!-- 2. 후원 금액 입력 -->
  <div class="input-group">
    <label for="amount">후원할 금액 (KRW)</label>
    <input type="number" id="amount" value="5000" min="1000" step="1000" placeholder="금액 입력">
  </div>

  <!-- 3. 기존 토스 결제위젯 영역 -->
  <div id="payment-method"></div>
  <div id="agreement"></div>

  <!-- 4. 결제 버튼 그룹 (위젯 결제 / 독립 가상계좌 결제) -->
  <div class="btn-group">
    <button id="payment-button" class="submit-btn" disabled>로딩 중...</button>
    <button id="vaccount-button" type="button" class="vaccount-btn">🏦 가상계좌로 후원하기</button>
  </div>

  <!-- 감사 모달 -->
  <div id="thanks-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-icon" id="modal-icon">🎉</div>
      <div class="modal-title" id="modal-user-name">후원해 주셔서 감사합니다!</div>
      <div class="modal-desc" id="modal-message">
        전달해 주신 마음은 NFC Card Reader 프로젝트 개발에 큰 힘이 됩니다.
      </div>
      <button class="modal-close-btn" onclick="closeModal()">확인</button>
    </div>
  </div>

  <script>
    // 토스페이먼츠 테스트 키세팅
    const widgetClientKey = "test_gck_docs_Ovk5rk1EwkEbP0W43n07xlzm"; // 위젯용 키
    const standardClientKey = "test_ck_D5148x91811e5m40A0a349R12482"; // 표준결제창 키
    const customerKey = "USER_" + Math.random().toString(36).substring(2, 10);
    const discordWebhookUrl = "https://discord.com/api/webhooks/1533835863476277409/ElYXaRFwnxy4MSjLTeeplY8fJr6qQvj1QJMzNnLxArGIrBhJx6pRlsbbtcCo84h3vzrc";

    // SDK 객체 초기화
    const tossPaymentsWidget = TossPayments(widgetClientKey);
    const tossPaymentsStandard = TossPayments(standardClientKey);
    const widgets = tossPaymentsWidget.widgets({ customerKey });
    
    let currentAmount = 5000;

    async function initWidget() {
      const amountInput = document.getElementById("amount");
      const paymentButton = document.getElementById("payment-button");

      try {
        await widgets.setAmount({ currency: "KRW", value: currentAmount });
        await Promise.all([
          widgets.renderPaymentMethods({ selector: "#payment-method" }),
          widgets.renderAgreement({ selector: "#agreement" })
        ]);

        paymentButton.disabled = false;
        paymentButton.innerText = `${currentAmount.toLocaleString()}원 후원 결제하기`;
      } catch (e) {
        console.error("위젯 로딩 실패:", e);
      }

      // 금액 변경 시 위젯 동기화
      amountInput.addEventListener("input", async (e) => {
        const val = Number(e.target.value);
        if (val >= 1000) {
          currentAmount = val;
          paymentButton.innerText = `${currentAmount.toLocaleString()}원 후원 결제하기`;
          await widgets.setAmount({ currency: "KRW", value: currentAmount });
        }
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      initWidget();

      const paymentButton = document.getElementById("payment-button");
      const vaccountButton = document.getElementById("vaccount-button");
      const nicknameInput = document.getElementById("nickname");
      const amountInput = document.getElementById("amount");

      const cleanUrl = window.location.origin + window.location.pathname;

      // 1. 위젯 결제하기 버튼 클릭
      paymentButton.addEventListener("click", async () => {
        const nickname = nicknameInput.value.trim() || "익명 후원자";

        try {
          await widgets.requestPayment({
            orderId: "ORDER_" + Date.now(),
            orderName: "NFC Card Reader 프로젝트 후원",
            customerName: nickname,
            successUrl: cleanUrl + `?status=success&name=${encodeURIComponent(nickname)}&type=WIDGET`,
            failUrl: cleanUrl + "?status=fail"
          });
        } catch (error) {
          if (error.code !== "USER_CANCEL") {
            alert("결제 에러: " + error.message);
          }
        }
      });

      // 2. [가상계좌로 후원하기] 별도 버튼 클릭
      vaccountButton.addEventListener("click", () => {
        const nickname = nicknameInput.value.trim() || "익명 후원자";
        const amount = Number(amountInput.value);

        if (!amount || amount < 1000) {
          alert("최소 후원 금액은 1,000원 이상입니다.");
          return;
        }

        // 별도의 가상계좌 창 직접 호출
        tossPaymentsStandard.requestPayment('가상계좌', {
          amount: amount,
          orderId: "ORDER_VAC_" + Date.now(),
          orderName: "NFC Card Reader 프로젝트 후원 (가상계좌)",
          customerName: nickname,
          successUrl: cleanUrl + `?status=success&name=${encodeURIComponent(nickname)}&type=VACCOUNT`,
          failUrl: cleanUrl + "?status=fail"
        }).catch(function (error) {
          if (error.code !== 'USER_CANCEL') {
            alert("가상계좌 창 에러: " + error.message);
          }
        });
      });

      checkPaymentResult();
    });

    // 결제 성공 및 가상계좌 처리
    function checkPaymentResult() {
      const urlParams = new URLSearchParams(window.location.search);
      const status = urlParams.get("status");

      if (status === "success") {
        const userName = urlParams.get("name") || "익명 후원자";
        const orderId = urlParams.get("orderId") || "N/A";
        const amount = urlParams.get("amount") || currentAmount;
        const type = urlParams.get("type");

        if (type === "VACCOUNT") {
          // 별도 가상계좌 버튼으로 신청한 경우
          document.getElementById("modal-icon").innerText = "🏦";
          document.getElementById("modal-user-name").innerText = `${userName}님, 가상계좌가 발급되었습니다!`;
          document.getElementById("modal-message").innerHTML = `
            가상계좌 발급이 성공적으로 처리되었습니다.<br><br>
            <b>후원 금액:</b> ${Number(amount).toLocaleString()}원<br>
            <b>주문 번호:</b> ${orderId}<br><br>
            선택하신 은행의 가상계좌로 입금을 완료해 주시면 후원이 최종 완료됩니다.
          `;
          sendDiscordWebhook(userName, amount, orderId, "가상계좌 신청 완료");
        } else {
          // 위젯을 통한 결제 완료
          document.getElementById("modal-icon").innerText = "🎉";
          document.getElementById("modal-user-name").innerText = `${userName}님, 진심으로 감사드립니다!`;
          document.getElementById("modal-message").innerHTML = `
            전달해 주신 마음은 NFC Card Reader 프로젝트 개발에 큰 힘이 됩니다.<br><br>
            <b>후원 금액:</b> ${Number(amount).toLocaleString()}원
          `;
          sendDiscordWebhook(userName, amount, orderId, "위젯 결제 완료");
        }

        document.getElementById("thanks-modal").style.display = "flex";
        window.history.replaceState({}, document.title, window.location.pathname);

      } else if (status === "fail") {
        const message = urlParams.get("message") || "결제가 취소되었습니다.";
        alert(`❌ 결제 취소/실패: ${message}`);
        window.history.replaceState({}, document.title, window.location.pathname);
      }
    }

    // 디스코드 웹훅 알림 전송
    function sendDiscordWebhook(name, amount, orderId, payType) {
      const now = new Date().toLocaleString("ko-KR", { timeZone: "Asia/Seoul" });
      const formattedAmount = Number(amount).toLocaleString();

      const payload = {
        embeds: [
          {
            title: `🎉 새로운 후원 접수 (${payType})`,
            color: 5814783,
            fields: [
              { name: "👤 후원자 닉네임", value: name, inline: true },
              { name: "💰 후원 금액", value: `${formattedAmount} 원`, inline: true },
              { name: "💳 결제 방식", value: payType, inline: false },
              { name: "🆔 주문 번호", value: orderId, inline: false },
              { name: "⏰ 일시", value: now, inline: false }
            ],
            footer: { text: "NFC Card Reader 후원 시스템" }
          }
        ]
      };

      fetch(discordWebhookUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      }).catch(err => console.error("디스코드 웹훅 전송 실패:", err));
    }

    function closeModal() {
      document.getElementById("thanks-modal").style.display = "none";
    }
  </script>
</body>
</html>
