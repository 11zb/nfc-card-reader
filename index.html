<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFC Card Reader - 후원하기</title>

  <!-- 토스페이먼츠 표준 SDK -->
  <script src="https://js.tosspayments.com/v1/payment"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 500px;
      margin: 30px auto;
      padding: 24px;
      background-color: #f5f5f7;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      position: relative;
    }
    h2 { margin-top: 0; color: #1d1d1f; font-size: 22px; }
    
    .input-group { margin: 16px 0; }
    label { display: block; font-size: 14px; color: #6e6e73; margin-bottom: 6px; font-weight: 500; }
    input, select {
      width: 100%;
      padding: 12px 14px;
      font-size: 16px;
      border: 1px solid #d2d2d7;
      border-radius: 10px;
      outline: none;
      background: #fff;
    }
    input:focus, select:focus { border-color: #0071e3; }
    
    .pay-type-container {
      display: flex;
      gap: 8px;
      margin-top: 15px;
    }
    .pay-type-btn {
      flex: 1;
      padding: 12px;
      border: 1px solid #d2d2d7;
      border-radius: 10px;
      background: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      color: #1d1d1f;
    }
    .pay-type-btn.active {
      border-color: #0064FF;
      background: #e8f3ff;
      color: #0064FF;
    }

    .submit-btn {
      width: 100%;
      height: 52px;
      margin-top: 20px;
      background-color: #0064FF;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .submit-btn:hover { background-color: #0052cc; }

    /* 감사 & 가상계좌 모달 */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      z-index: 999;
      justify-content: center;
      align-items: center;
    }
    .modal-card {
      background: #ffffff;
      padding: 32px 24px;
      border-radius: 20px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      animation: popIn 0.3s ease-out;
    }
    .modal-icon { font-size: 48px; margin-bottom: 12px; }
    .modal-title { font-size: 20px; font-weight: 700; color: #1d1d1f; margin-bottom: 8px; }
    .modal-desc { font-size: 14px; color: #515154; line-height: 1.6; margin-bottom: 20px; text-align: left; background: #f9f9fb; padding: 14px; border-radius: 10px; }
    .modal-close-btn {
      width: 100%;
      padding: 12px;
      background: #f2f2f7;
      color: #0071e3;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <h2>프로젝트 후원하기</h2>
  
  <div class="input-group">
    <label for="nickname">후원자 이름 / 닉네임</label>
    <input type="text" id="nickname" placeholder="닉네임을 입력해주세요" value="익명 후원자">
  </div>

  <div class="input-group">
    <label for="amount">후원할 금액 (KRW)</label>
    <input type="number" id="amount" value="5000" min="1000" step="1000" placeholder="금액 입력">
  </div>

  <div class="input-group">
    <label>결제 수단 선택</label>
    <div class="pay-type-container">
      <button type="button" class="pay-type-btn active" id="btn-card" onclick="selectPayType('카드')">카드 / Apple Pay</button>
      <button type="button" class="pay-type-btn" id="btn-vaccount" onclick="selectPayType('가상계좌')">가상계좌</button>
    </div>
  </div>

  <button id="payment-button" class="submit-btn">5,000원 후원 결제하기</button>

  <!-- 감사 & 안내 모달 레이어 -->
  <div id="thanks-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-icon" id="modal-icon">🎉</div>
      <div class="modal-title" id="modal-user-name">후원해 주셔서 감사합니다!</div>
      <div class="modal-desc" id="modal-message">
        전달해 주신 마음은 NFC Card Reader 프로젝트 개발에 큰 힘이 됩니다.
      </div>
      <button class="modal-close-btn" onclick="closeModal()">확인</button>
    </div>
  </div>

  <script>
    // 토스 표준 결제창 공용 테스트 키
    const clientKey = "test_ck_P42nVLL23131N03B3aB3AM1y485w"; 
    const discordWebhookUrl = "https://discord.com/api/webhooks/1533835863476277409/ElYXaRFwnxy4MSjLTeeplY8fJr6qQvj1QJMzNnLxArGIrBhJx6pRlsbbtcCo84h3vzrc";

    const tossPayments = TossPayments(clientKey);
    let selectedPayMethod = "카드";

    function selectPayType(type) {
      selectedPayMethod = type;
      document.getElementById("btn-card").classList.toggle("active", type === "카드");
      document.getElementById("btn-vaccount").classList.toggle("active", type === "가상계좌");
    }

    document.addEventListener("DOMContentLoaded", () => {
      const amountInput = document.getElementById("amount");
      const nicknameInput = document.getElementById("nickname");
      const paymentButton = document.getElementById("payment-button");

      amountInput.addEventListener("input", (e) => {
        const val = Number(e.target.value);
        if (val >= 1000) {
          paymentButton.innerText = `${val.toLocaleString()}원 후원 결제하기`;
        } else {
          paymentButton.innerText = `금액을 입력해주세요`;
        }
      });

      paymentButton.addEventListener("click", () => {
        const amount = Number(amountInput.value);
        const nickname = nicknameInput.value.trim() || "익명 후원자";

        if (!amount || amount < 1000) {
          alert("최소 후원 금액은 1,000원 이상입니다.");
          return;
        }

        const payOptions = {
          amount: amount,
          orderId: "ORDER_" + Math.random().toString(36).substring(2, 12),
          orderName: "NFC Card Reader 프로젝트 후원",
          customerName: nickname,
          successUrl: window.location.origin + window.location.pathname + `?status=success&name=${encodeURIComponent(nickname)}&type=${encodeURIComponent(selectedPayMethod)}`,
          failUrl: window.location.origin + window.location.pathname + "?status=fail",
        };

        // 가상계좌 선택 시 무조건 가상계좌 창 팝업
        tossPayments.requestPayment(selectedPayMethod, payOptions)
          .catch(function (error) {
            if (error.code !== 'USER_CANCEL') {
              alert("결제 에러: " + error.message);
            }
          });
      });

      checkPaymentResult();
    });

    function checkPaymentResult() {
      const urlParams = new URLSearchParams(window.location.search);
      const status = urlParams.get("status");

      if (status === "success") {
        const userName = urlParams.get("name") || "익명 후원자";
        const orderId = urlParams.get("orderId") || "N/A";
        const amount = urlParams.get("amount") || "5000";
        const payType = urlParams.get("type") || "카드";

        if (payType === "가상계좌") {
          document.getElementById("modal-icon").innerText = "🏦";
          document.getElementById("modal-user-name").innerText = `${userName}님, 가상계좌가 발급되었습니다!`;
          document.getElementById("modal-message").innerHTML = `
            가상계좌 발급이 완료되었습니다.<br><br>
            <b>후원 금액:</b> ${Number(amount).toLocaleString()}원<br>
            <b>주문 번호:</b> ${orderId}<br><br>
            선택하신 은행으로 입금을 진행해 주시면 후원이 최종 처리됩니다.
          `;
        } else {
          document.getElementById("modal-icon").innerText = "🎉";
          document.getElementById("modal-user-name").innerText = `${userName}님, 진심으로 감사드립니다!`;
          document.getElementById("modal-message").innerHTML = `
            전달해 주신 마음은 NFC Card Reader 프로젝트 개발에 큰 힘이 됩니다.<br><br>
            <b>후원 금액:</b> ${Number(amount).toLocaleString()}원
          `;
        }

        sendDiscordWebhook(userName, amount, orderId, payType);
        document.getElementById("thanks-modal").style.display = "flex";
        window.history.replaceState({}, document.title, window.location.pathname);

      } else if (status === "fail") {
        const message = urlParams.get("message") || "결제가 취소되었습니다.";
        alert(`❌ 결제 취소/실패: ${message}`);
        window.history.replaceState({}, document.title, window.location.pathname);
      }
    }

    function sendDiscordWebhook(name, amount, orderId, payType) {
      const now = new Date().toLocaleString("ko-KR", { timeZone: "Asia/Seoul" });
      const formattedAmount = Number(amount).toLocaleString();

      const payload = {
        embeds: [
          {
            title: `🎉 새로운 후원 요청 (${payType})`,
            color: 5814783,
            fields: [
              { name: "👤 후원자 닉네임", value: name, inline: true },
              { name: "💰 후원 금액", value: `${formattedAmount} 원`, inline: true },
              { name: "💳 결제 방식", value: payType, inline: false },
              { name: "🆔 주문 번호", value: orderId, inline: false },
              { name: "⏰ 일시", value: now, inline: false }
            ],
            footer: { text: "NFC Card Reader 후원 시스템" }
          }
        ]
      };

      fetch(discordWebhookUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      }).catch(err => console.error("디스코드 웹훅 전송 실패:", err));
    }

    function closeModal() {
      document.getElementById("thanks-modal").style.display = "none";
    }
  </script>
</body>
</html>
