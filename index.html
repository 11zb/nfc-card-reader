<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>iPhone 계산기</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation; /* 모바일 더블 탭 확대 방지 */
    }

    body {
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    }

    /* 아이폰 계산기 프레임 */
    .calculator {
      width: 340px;
      height: 580px;
      background-color: #000000;
      padding: 20px 16px 24px;
      border-radius: 40px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      box-shadow: 0 20px 50px rgba(255, 255, 255, 0.08);
      position: relative;
    }

    /* 디스플레이 화면 */
    .display {
      color: #ffffff;
      font-size: 72px;
      font-weight: 300;
      text-align: right;
      padding: 0 12px 12px;
      word-break: break-all;
      line-height: 1.1;
      letter-spacing: -2px;
      transition: font-size 0.2s ease;
    }

    /* 버튼 그리드 */
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .btn {
      border: none;
      outline: none;
      height: 64px;
      border-radius: 50%;
      font-size: 28px;
      font-weight: 400;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: filter 0.15s ease, background-color 0.2s ease;
    }

    .btn:active { filter: brightness(130%); }
    .btn-light-gray { background-color: #a5a5a5; color: #000000; font-weight: 500; }
    .btn-dark-gray { background-color: #333333; color: #ffffff; }
    .btn-orange { background-color: #ff9f0a; color: #ffffff; font-size: 32px; }
    .btn-orange.active { background-color: #ffffff; color: #ff9f0a; }
    .btn-zero { grid-column: span 2; border-radius: 32px; justify-content: flex-start; padding-left: 26px; }

    /* 모의 결제창 모달 라이트 스타일 */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-overlay.active { display: flex; }

    .payment-modal {
      background: #ffffff;
      width: 90%;
      max-width: 360px;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      color: #191f28;
      animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-title { font-size: 18px; font-weight: 700; color: #333d4b; }
    .close-btn { background: none; border: none; font-size: 22px; color: #8b95a1; cursor: pointer; }

    .payment-info {
      background: #f9fafb;
      padding: 16px;
      border-radius: 16px;
      margin-bottom: 20px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 14px;
      color: #4e5968;
    }

    .info-row.total {
      margin-bottom: 0;
      padding-top: 8px;
      border-top: 1px dashed #e5e8eb;
      font-weight: 700;
      font-size: 16px;
      color: #191f28;
    }

    .pay-btn {
      width: 100%;
      padding: 16px;
      background-color: #3182f6;
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .pay-btn:hover { background-color: #1b64da; }
  </style>
</head>
<body>

  <!-- 계산기 -->
  <div class="calculator">
    <div class="display" id="display">0</div>
    <div class="buttons">
      <button class="btn btn-light-gray" id="btn-clear" onclick="handleClear()">AC</button>
      <button class="btn btn-light-gray" onclick="toggleSign()">+/–</button>
      <button class="btn btn-light-gray" onclick="handlePercent()">%</button>
      <button class="btn btn-orange operator" onclick="setOperator('÷', this)">÷</button>

      <button class="btn btn-dark-gray" onclick="appendNumber('7')">7</button>
      <button class="btn btn-dark-gray" onclick="appendNumber('8')">8</button>
      <button class="btn btn-dark-gray" onclick="appendNumber('9')">9</button>
      <button class="btn btn-orange operator" onclick="setOperator('×', this)">×</button>

      <button class="btn btn-dark-gray" onclick="appendNumber('4')">4</button>
      <button class="btn btn-dark-gray" onclick="appendNumber('5')">5</button>
      <button class="btn btn-dark-gray" onclick="appendNumber('6')">6</button>
      <button class="btn btn-orange operator" onclick="setOperator('–', this)">–</button>

      <button class="btn btn-dark-gray" onclick="appendNumber('1')">1</button>
      <button class="btn btn-dark-gray" onclick="appendNumber('2')">2</button>
      <button class="btn btn-dark-gray" onclick="appendNumber('3')">3</button>
      <button class="btn btn-orange operator" onclick="setOperator('+', this)">+</button>

      <button class="btn btn-dark-gray btn-zero" onclick="appendNumber('0')">0</button>
      <button class="btn btn-dark-gray" onclick="appendDecimal()">.</button>
      <button class="btn btn-orange" onclick="onEqualPressed()">=</button>
    </div>
  </div>

  <!-- 자체 모의 결제 모달창 -->
  <div class="modal-overlay" id="payment-modal">
    <div class="payment-modal">
      <div class="modal-header">
        <span class="modal-title">결제 승인</span>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>
      <div class="payment-info">
        <div class="info-row">
          <span>주문 내용</span>
          <span>계산 결과 열람 권한</span>
        </div>
        <div class="info-row total">
          <span>결제 금액</span>
          <span>999,000 원</span>
        </div>
      </div>
      <button class="pay-btn" onclick="confirmPayment()">999,000원 결제하기</button>
    </div>
  </div>

  <script>
    let currentInput = '0';
    let previousInput = null;
    let selectedOperator = null;
    let waitingForNextInput = false;
    let pendingResult = null;

    const displayElement = document.getElementById('display');
    const clearBtn = document.getElementById('btn-clear');
    const modalElement = document.getElementById('payment-modal');

    function updateDisplay() {
      let formatted = currentInput;
      if (currentInput !== 'Error') {
        const parts = currentInput.split('.');
        parts[0] = Number(parts[0]).toLocaleString('en-US', { maximumFractionDigits: 10 });
        formatted = parts.join('.');
      }
      displayElement.textContent = formatted;

      const length = formatted.length;
      if (length > 8) displayElement.style.fontSize = '40px';
      else if (length > 6) displayElement.style.fontSize = '54px';
      else displayElement.style.fontSize = '72px';

      clearBtn.textContent = (currentInput !== '0' || previousInput !== null) ? 'C' : 'AC';
    }

    function appendNumber(number) {
      clearActiveOperators();
      if (waitingForNextInput) {
        currentInput = number;
        waitingForNextInput = false;
      } else {
        if (currentInput === '0') currentInput = number;
        else if (currentInput.replace(/[^0-9]/g, '').length < 9) currentInput += number;
      }
      updateDisplay();
    }

    function appendDecimal() {
      clearActiveOperators();
      if (waitingForNextInput) {
        currentInput = '0.';
        waitingForNextInput = false;
      } else if (!currentInput.includes('.')) {
        currentInput += '.';
      }
      updateDisplay();
    }

    function handleClear() {
      currentInput = '0';
      if (clearBtn.textContent === 'AC') {
        previousInput = null;
        selectedOperator = null;
      }
      clearActiveOperators();
      updateDisplay();
    }

    function toggleSign() {
      if (currentInput !== '0' && currentInput !== 'Error') {
        currentInput = (parseFloat(currentInput) * -1).toString();
        updateDisplay();
      }
    }

    function handlePercent() {
      if (currentInput !== 'Error') {
        currentInput = (parseFloat(currentInput) / 100).toString();
        updateDisplay();
      }
    }

    function setOperator(op, element) {
      if (selectedOperator && !waitingForNextInput) calculateInternal();
      previousInput = currentInput;
      selectedOperator = op;
      waitingForNextInput = true;
      clearActiveOperators();
      element.classList.add('active');
    }

    function calculateInternal() {
      if (!selectedOperator || previousInput === null) return currentInput;
      const prev = parseFloat(previousInput);
      const current = parseFloat(currentInput);
      let result = 0;

      switch (selectedOperator) {
        case '+': result = prev + current; break;
        case '–': result = prev - current; break;
        case '×': result = prev * current; break;
        case '÷': result = current === 0 ? 'Error' : prev / current; break;
      }

      selectedOperator = null;
      previousInput = null;
      waitingForNextInput = true;
      return result.toString();
    }

    function clearActiveOperators() {
      document.querySelectorAll('.operator').forEach(btn => btn.classList.remove('active'));
    }

    // '=' 클릭 시 모달창 오픈
    function onEqualPressed() {
      if (!selectedOperator || previousInput === null) return;
      pendingResult = calculateInternal();
      clearActiveOperators();
      modalElement.classList.add('active');
    }

    function closeModal() {
      modalElement.classList.remove('active');
    }

    // 결제 성공 클릭 시 결과 디스플레이 표시
    function confirmPayment() {
      closeModal();
      currentInput = pendingResult;
      updateDisplay();
    }
  </script>
</body>
</html>
