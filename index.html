<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 모바일 사이즈 대응 및 더블 탭 화면 확대 완벽 방지 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>iPhone 계산기 (토스 결제 위젯)</title>

  <!-- 토스페이먼츠 공식 V2 SDK -->
  <script src="https://js.tosspayments.com/v2/standard"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation; /* 더블 탭 확대 방지 */
    }

    body {
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      overflow: hidden; /* 스크롤 방지 */
    }

    /* 휴대폰 화면 전체를 채우는 계산기 레이아웃 */
    .calculator {
      width: 100vw;
      height: 100dvh; /* 모바일 브라우저 주소창 제외한 실제 화면 높이 */
      max-width: 480px; /* PC에서 볼 때 모바일 사이즈 유지 */
      margin: 0 auto;
      background-color: #000;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 20px 16px 40px;
    }

    /* 계산기 디스플레이 */
    .display {
      color: #ffffff;
      font-size: 20vw; /* 화면 비율에 맞춘 폰트 크기 */
      font-weight: 300;
      text-align: right;
      padding: 0 16px 20px;
      word-break: break-all;
      line-height: 1;
      letter-spacing: -2px;
      transition: font-size 0.2s ease;
    }
    @media (min-width: 480px) { .display { font-size: 90px; } }

    /* 버튼 그리드 */
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    /* 버튼 공통 (1:1 비율 유지) */
    .btn {
      border: none;
      outline: none;
      width: 100%;
      aspect-ratio: 1; 
      border-radius: 50%;
      font-size: 32px;
      font-weight: 400;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: filter 0.1s ease, background-color 0.2s ease;
    }
    .btn:active { filter: brightness(140%); }

    /* 색상 테마 */
    .btn-light-gray { background-color: #a5a5a5; color: #000000; font-weight: 500; font-size: 28px; }
    .btn-dark-gray { background-color: #333333; color: #ffffff; }
    .btn-orange { background-color: #ff9f0a; color: #ffffff; font-size: 36px; }
    .btn-orange.active { background-color: #ffffff; color: #ff9f0a; }

    /* 0 버튼 (2칸) */
    .btn-zero {
      grid-column: span 2;
      aspect-ratio: auto;
      border-radius: 100px;
      justify-content: flex-start;
      padding-left: 28px;
    }

    /* 토스 결제 위젯 모달창 (화면 전체 덮기) */
    .widget-modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100dvh;
      background: #ffffff;
      z-index: 9999;
      flex-direction: column;
      overflow-y: auto;
      animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .widget-modal.active { display: flex; }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid #e5e8eb;
      background: #fff;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .modal-title { font-size: 18px; font-weight: 700; color: #191f28; }
    .close-btn { background: none; border: none; font-size: 28px; color: #8b95a1; cursor: pointer; }

    .widget-container { padding: 10px 10px 120px 10px; }
    
    .pay-btn-wrapper {
      position: fixed;
      bottom: 0; left: 0; width: 100%;
      padding: 16px 20px 30px;
      background: #fff;
      box-shadow: 0 -4px 16px rgba(0,0,0,0.06);
    }
    .pay-btn {
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
      display: block;
      padding: 16px;
      background-color: #3182f6;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- 계산기 UI -->
  <div class="calculator">
    <div class="display" id="display">0</div>
    <div class="buttons">
      <button class="btn btn-light-gray" id="btn-clear" onclick="handleClear()">AC</button>
      <button class="btn btn-light-gray" onclick="toggleSign()">+/–</button>
      <button class="btn btn-light-gray" onclick="handlePercent()">%</button>
      <button class="btn btn-orange operator" onclick="setOperator('÷', this)">÷</button>

      <button class="btn btn-dark-gray" onclick="appendNumber('7')">7</button>
      <button class="btn btn-dark-gray" onclick="appendNumber('8')">8</button>
      <button class="btn btn-dark-gray" onclick="appendNumber('9')">9</button>
      <button class="btn btn-orange operator" onclick="setOperator('×', this)">×</button>

      <button class="btn btn-dark-gray" onclick="appendNumber('4')">4</button>
      <button class="btn btn-dark-gray" onclick="appendNumber('5')">5</button>
      <button class="btn btn-dark-gray" onclick="appendNumber('6')">6</button>
      <button class="btn btn-orange operator" onclick="setOperator('–', this)">–</button>

      <button class="btn btn-dark-gray" onclick="appendNumber('1')">1</button>
      <button class="btn btn-dark-gray" onclick="appendNumber('2')">2</button>
      <button class="btn btn-dark-gray" onclick="appendNumber('3')">3</button>
      <button class="btn btn-orange operator" onclick="setOperator('+', this)">+</button>

      <button class="btn btn-dark-gray btn-zero" onclick="appendNumber('0')">0</button>
      <button class="btn btn-dark-gray" onclick="appendDecimal()">.</button>
      <button class="btn btn-orange" onclick="onEqualPressed()">=</button>
    </div>
  </div>

  <!-- 결제 위젯 모달 -->
  <div class="widget-modal" id="widget-modal">
    <div class="modal-header">
      <span class="modal-title">결제수단 선택</span>
      <button class="close-btn" onclick="closeModal()">&times;</button>
    </div>
    <div class="widget-container">
      <!-- 토스 위젯 렌더링 영역 -->
      <div id="payment-method"></div>
      <div id="agreement"></div>
    </div>
    <div class="pay-btn-wrapper">
      <button class="pay-btn" onclick="requestPayment()">999,000원 결제하기</button>
    </div>
  </div>

  <script>
    // --- 1. 계산기 로직 ---
    let currentInput = '0';
    let previousInput = null;
    let selectedOperator = null;
    let waitingForNextInput = false;

    const displayElement = document.getElementById('display');
    const clearBtn = document.getElementById('btn-clear');

    function updateDisplay() {
      let formatted = currentInput;
      if (currentInput !== 'Error') {
        const parts = currentInput.split('.');
        parts[0] = Number(parts[0]).toLocaleString('en-US', { maximumFractionDigits: 10 });
        formatted = parts.join('.');
      }
      displayElement.textContent = formatted;

      const len = formatted.length;
      if (len > 9) displayElement.style.fontSize = '12vw';
      else if (len > 7) displayElement.style.fontSize = '16vw';
      else displayElement.style.fontSize = '20vw';

      clearBtn.textContent = (currentInput !== '0' || previousInput !== null) ? 'C' : 'AC';
    }

    function appendNumber(num) {
      clearActiveOperators();
      if (waitingForNextInput) {
        currentInput = num;
        waitingForNextInput = false;
      } else {
        if (currentInput === '0') currentInput = num;
        else if (currentInput.replace(/[^0-9]/g, '').length < 9) currentInput += num;
      }
      updateDisplay();
    }

    function appendDecimal() {
      clearActiveOperators();
      if (waitingForNextInput) { currentInput = '0.'; waitingForNextInput = false; } 
      else if (!currentInput.includes('.')) { currentInput += '.'; }
      updateDisplay();
    }

    function handleClear() {
      currentInput = '0';
      if (clearBtn.textContent === 'AC') { previousInput = null; selectedOperator = null; }
      clearActiveOperators(); updateDisplay();
    }

    function toggleSign() {
      if (currentInput !== '0' && currentInput !== 'Error') {
        currentInput = (parseFloat(currentInput) * -1).toString();
        updateDisplay();
      }
    }

    function handlePercent() {
      if (currentInput !== 'Error') {
        currentInput = (parseFloat(currentInput) / 100).toString();
        updateDisplay();
      }
    }

    function setOperator(op, element) {
      if (selectedOperator && !waitingForNextInput) calculateInternal();
      previousInput = currentInput;
      selectedOperator = op;
      waitingForNextInput = true;
      clearActiveOperators();
      element.classList.add('active');
    }

    function calculateInternal() {
      if (!selectedOperator || previousInput === null) return currentInput;
      const prev = parseFloat(previousInput); const curr = parseFloat(currentInput);
      let res = 0;
      switch (selectedOperator) {
        case '+': res = prev + curr; break;
        case '–': res = prev - curr; break;
        case '×': res = prev * curr; break;
        case '÷': res = curr === 0 ? 'Error' : prev / curr; break;
      }
      selectedOperator = null; previousInput = null; waitingForNextInput = true;
      return res.toString();
    }

    function clearActiveOperators() {
      document.querySelectorAll('.operator').forEach(btn => btn.classList.remove('active'));
    }

    // --- 2. 토스페이먼츠 위젯 로직 (공식 문서 100% 준수) ---
    
    // 유저가 제공한 위젯 전용 테스트 키 (gck)
    const clientKey = "test_gck_docs_Ovk5rk1EwkEbP0W43n07xlzm";
    const customerKey = "USER_" + Math.floor(Math.random() * 10000000);
    
    let tossWidgets = null;
    let isWidgetRendered = false;

    // 결제 성공 후 리다이렉트되어 돌아왔을 때 결과 표시
    window.addEventListener('load', () => {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('paymentSuccess') === 'true') {
        const savedResult = localStorage.getItem('calc_result');
        if (savedResult) {
          currentInput = savedResult;
          updateDisplay();
        }
        window.history.replaceState({}, document.title, window.location.pathname);
      }
    });

    async function onEqualPressed() {
      if (!selectedOperator || previousInput === null) return;
      
      // 파일 탐색기로 열었을 경우 원천 차단 안내
      if (window.location.protocol === 'file:') {
        alert("현재 HTML 파일을 직접 실행(file://)하셨습니다.\n토스 결제 위젯은 보안상 http:// 환경(웹 서버)에서만 렌더링됩니다.\n\nVS Code의 'Live Server' 등을 이용해 열어주세요.");
        return;
      }

      // 1. 계산 결과를 로컬스토리지에 임시 저장 (리다이렉트 후 복구용)
      const pendingResult = calculateInternal();
      localStorage.setItem('calc_result', pendingResult);
      clearActiveOperators();

      // 2. 모달 열기
      const modal = document.getElementById('widget-modal');
      modal.classList.add('active');

      // 3. 위젯이 한 번도 렌더링되지 않았을 때만 렌더링 실행
      if (!isWidgetRendered) {
        try {
          // 문서 스펙: TossPayments 인스턴스 생성 후 .widgets() 호출
          const tossPayments = TossPayments(clientKey);
          tossWidgets = tossPayments.widgets({ customerKey });

          // 결제 금액 설정
          await tossWidgets.setAmount({ currency: "KRW", value: 999000 });

          // 위젯 UI 렌더링 (결제수단, 약관)
          await Promise.all([
            tossWidgets.renderPaymentMethods({ selector: "#payment-method", variantKey: "DEFAULT" }),
            tossWidgets.renderAgreement({ selector: "#agreement", variantKey: "AGREEMENT" })
          ]);
          
          isWidgetRendered = true;
        } catch (error) {
          console.error("위젯 렌더링 에러:", error);
          alert("위젯 로딩 실패. 새로고침 후 다시 시도해주세요.\n상세 에러: " + error.message);
        }
      }
    }

    function closeModal() {
      document.getElementById('widget-modal').classList.remove('active');
    }

    // 999,000원 결제하기 버튼 클릭
    async function requestPayment() {
      if (!tossWidgets) return;
      
      try {
        const baseUrl = window.location.origin + window.location.pathname;
        const randomOrderId = "ORDER_" + Date.now() + "_" + Math.floor(Math.random() * 1000);

        // 위젯 전용 결제 요청 메서드 호출
        await tossWidgets.requestPayment({
          orderId: randomOrderId,
          orderName: "계산 결과 열람 (999,000원)",
          successUrl: baseUrl + "?paymentSuccess=true",
          failUrl: baseUrl + "?paymentSuccess=false",
          customerName: "홍길동"
        });
      } catch (error) {
        if (error.code !== "USER_CANCEL") {
          alert("결제 오류 발생: " + (error.message || "알 수 없는 에러"));
        }
      }
    }
  </script>
</body>
</html>
