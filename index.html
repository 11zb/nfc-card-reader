<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>모바일 웹 교통카드 조회</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f5f5f7;
      padding: 20px;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      text-align: center;
      width: 100%;
      max-width: 320px;
    }
    .btn {
      background-color: #007aff;
      color: white;
      border: none;
      padding: 15px 25px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 12px;
      width: 100%;
      cursor: pointer;
      margin-top: 15px;
    }
    .btn:active { background-color: #0056b3; }
    .status { margin-top: 20px; font-size: 14px; color: #666; word-break: break-all; }
    .result { font-size: 24px; font-weight: bold; color: #1d1d1f; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>교통카드 잔액 조회</h2>
    <p style="color: #888; font-size: 13px;">안드로이드 Chrome 환경 권장</p>
    
    <button id="scanBtn" class="btn">카드 스캔 시작하기</button>
    
    <div id="status" class="status">버튼을 누르고 카드를 휴대폰 뒷면에 대주세요.</div>
    <div id="result" class="result"></div>
  </div>

  <script>
    const scanBtn = document.getElementById('scanBtn');
    const statusDiv = document.getElementById('status');
    const resultDiv = document.getElementById('result');

    scanBtn.addEventListener('click', async () => {
      // 1. Web NFC 지원 여부 확인
      if (!('NDEFReader' in window)) {
        statusDiv.innerText = "❌ 이 브라우저는 Web NFC를 지원하지 않습니다.\n(안드로이드 Chrome에서 접속해 주세요)";
        return;
      }

      try {
        // 2. NFC 스캐너 인스턴스 생성 및 스캔 개시
        const ndef = new NDEFReader();
        await ndef.scan();
        
        statusDiv.innerText = "📲 카드를 휴대폰 뒷면에 밀착시켜 주세요...";
        resultDiv.innerText = "";

        // 3. 에러 발생 시 처리
        ndef.addEventListener("readingerror", () => {
          statusDiv.innerText = "⚠️ 카드를 인식하지 못했습니다. 다시 시도해 주세요.";
        });

        // 4. 카드가 태그되었을 때 데이터 수신
        ndef.addEventListener("reading", ({ serialNumber, message }) => {
          statusDiv.innerText = "✅ 카드 인식 성공!";
          
          // 카드 시리얼 번호(UID) 표시
          let output = `카드 UID: ${serialNumber}\n`;

          // NDEF 레코드 데이터 읽기
          for (const record of message.records) {
            if (record.recordType === "text") {
              const textDecoder = new TextDecoder(record.encoding);
              output += `데이터: ${textDecoder.decode(record.data)}\n`;
            }
          }

          resultDiv.innerText = output;
        });

      } catch (error) {
        statusDiv.innerText = "오류 발생: " + error;
      }
    });
  </script>
</body>
</html>
