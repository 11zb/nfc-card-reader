<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFC Card Reader - 후원하기</title>

  <!-- 토스페이먼츠 최신 SDK v2 -->
  <script src="https://js.tosspayments.com/v2/standard"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 500px;
      margin: 30px auto;
      padding: 24px;
      background-color: #f5f5f7;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }
    h2 { margin-top: 0; color: #1d1d1f; font-size: 22px; }
    .input-group { margin: 20px 0; }
    label { display: block; font-size: 14px; color: #6e6e73; margin-bottom: 8px; font-weight: 500; }
    input {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      border: 1px solid #d2d2d7;
      border-radius: 10px;
      outline: none;
      background: #fff;
    }
    input:focus { border-color: #0071e3; }
    
    #payment-method { margin-top: 20px; min-height: 200px; }
    #agreement { margin-top: 10px; min-height: 100px; }

    .submit-btn {
      width: 100%;
      height: 52px;
      margin-top: 20px;
      background-color: #0064FF;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .submit-btn:hover { background-color: #0052cc; }
    .submit-btn:disabled { 
      background-color: #e5e5ea !important; 
      color: #86868b !important;
      cursor: not-allowed !important; 
    }
  </style>
</head>
<body>

  <h2>프로젝트 후원하기</h2>
  
  <div class="input-group">
    <label for="amount">후원할 금액 (KRW)</label>
    <input type="number" id="amount" value="5000" min="1000" step="1000" placeholder="금액 입력">
  </div>

  <!-- 토스 결제 수단 선택 UI 영역 -->
  <div id="payment-method">결제 모듈 로딩 중...</div>
  <div id="agreement"></div>

  <button id="payment-button" class="submit-btn" disabled>후원 결제하기</button>

  <script>
    // 토스페이먼츠 공식 샘플/테스트용 개발자 클라이언트 키
    const clientKey = "test_gck_docs_Ovk5rk1E802x05l2mg03n4W1"; 
    const customerKey = "USER_" + Math.random().toString(36).substring(2, 10);

    let widgets = null;
    let currentAmount = 5000;

    document.addEventListener("DOMContentLoaded", async () => {
      const amountInput = document.getElementById("amount");
      const paymentButton = document.getElementById("payment-button");

      try {
        // 1. 토스 SDK 초기화
        const tossPayments = TossPayments(clientKey);
        widgets = tossPayments.widgets({ customerKey });

        // 2. 결제 금액 세팅
        await widgets.setAmount({
          currency: "KRW",
          value: currentAmount,
        });

        // 3. 결제 수단 UI & 약관 동의 UI 렌더링
        await widgets.renderPaymentMethods({
          selector: "#payment-method",
          variantKey: "DEFAULT",
        });

        await widgets.renderAgreement({
          selector: "#agreement",
          variantKey: "AGREEMENT",
        });

        // 4. 로딩 완료 후 버튼 활성화
        paymentButton.disabled = false;
        paymentButton.innerText = `${currentAmount.toLocaleString()}원 후원 결제하기`;

      } catch (error) {
        console.error("토스 결제위젯 로딩 에러:", error);
        document.getElementById("payment-method").innerHTML = 
          `<p style="color:red; font-size:14px;">결제 모듈을 불러오지 못했습니다.<br>(${error.message || '인증 오류'})</p>`;
      }

      // 금액 입력 변경 시 실시간 반영
      amountInput.addEventListener("input", async (e) => {
        const val = Number(e.target.value);
        if (val >= 1000) {
          currentAmount = val;
          paymentButton.innerText = `${currentAmount.toLocaleString()}원 후원 결제하기`;
          if (widgets) {
            await widgets.setAmount({
              currency: "KRW",
              value: currentAmount,
            });
          }
        }
      });

      // 버튼 클릭 이벤트
      paymentButton.addEventListener("click", async () => {
        if (!widgets) return;

        try {
          await widgets.requestPayment({
            orderId: "ORDER_" + Math.random().toString(36).substring(2, 12),
            orderName: "NFC Card Reader 프로젝트 후원",
            successUrl: window.location.origin + window.location.pathname + "?status=success",
            failUrl: window.location.origin + window.location.pathname + "?status=fail",
          });
        } catch (error) {
          if (error.code !== "USER_CANCEL") {
            alert("결제 요청 중 오류가 발생했습니다: " + error.message);
          }
        }
      });

      // 결제 결과 URL 확인
      checkPaymentResult();
    });

    function checkPaymentResult() {
      const urlParams = new URLSearchParams(window.location.search);
      const status = urlParams.get("status");

      if (status === "success") {
        alert("🎉 후원해 주셔서 진심으로 감사드립니다!\n\n결제가 성공적으로 완료되었습니다.");
        window.history.replaceState({}, document.title, window.location.pathname);
      } else if (status === "fail") {
        const message = urlParams.get("message") || "결제가 취소되었거나 실패했습니다.";
        alert(`❌ 결제 실패: ${message}`);
        window.history.replaceState({}, document.title, window.location.pathname);
      }
    }
  </script>
</body>
</html>
