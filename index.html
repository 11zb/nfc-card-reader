<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>토스 결제 테스트</title>
  <script src="https://js.tosspayments.com/v2/standard"></script>
</head>
<body style="padding: 20px; max-width: 400px; margin: 0 auto;">
  <h2>결제 테스트</h2>
  <div id="payment-method"></div>
  <div id="agreement"></div>
  <button id="btn" style="width:100%; height:48px; background:#0064FF; color:#fff; border:none; border-radius:8px; font-weight:bold; margin-top:10px;">결제하기</button>

  <script>
    // 토스페이먼츠 공식 v2 위젯 전용 샘플 키
    const clientKey = "test_gck_docs_Ovk5rk1EwkEbP0W43n07xlzm";
    const tossPayments = TossPayments(clientKey);
    const widgets = tossPayments.widgets({ customerKey: "ANONYMOUS" });

    async function init() {
      await widgets.setAmount({ currency: "KRW", value: 5000 });
      await Promise.all([
        widgets.renderPaymentMethods({ selector: "#payment-method" }),
        widgets.renderAgreement({ selector: "#agreement" })
      ]);
    }
    init();

    document.getElementById("btn").addEventListener("click", async () => {
      await widgets.requestPayment({
        orderId: "ORDER_" + Date.now(),
        orderName: "테스트 후원",
        successUrl: window.location.href + "?status=success",
        failUrl: window.location.href + "?status=fail"
      });
    });
  </script>
</body>
</html>
