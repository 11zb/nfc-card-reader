<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFC Card Reader - Apple Pay 후원 데모</title>

  <!-- Apple Pay 공식 SDK -->
  <script src="https://applepay.cdn-apple.com/jssdk/v1/apple-pay-sdk.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 450px;
      margin: 40px auto;
      padding: 24px;
      background-color: #f5f5f7;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }
    h2 { margin-top: 0; color: #1d1d1f; font-size: 22px; }
    .input-group { margin: 20px 0; }
    label { display: block; font-size: 14px; color: #6e6e73; margin-bottom: 8px; font-weight: 500; }
    input {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      border: 1px solid #d2d2d7;
      border-radius: 10px;
      outline: none;
      background: #fff;
    }
    input:focus { border-color: #0071e3; }
    .btn-container { margin-top: 20px; width: 100%; }

    .custom-apple-pay-btn {
      width: 100%;
      height: 50px;
      background-color: #000;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background-color 0.2s, transform 0.1s;
    }
    .custom-apple-pay-btn:hover { background-color: #1a1a1a; }
    .custom-apple-pay-btn:active { transform: scale(0.98); }

    .notice {
      margin-top: 20px;
      font-size: 13px;
      color: #86868b;
      line-height: 1.5;
      background: #ffffff;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #e5e5ea;
    }
  </style>
</head>
<body>

  <h2>프로젝트 후원하기</h2>
  
  <div class="input-group">
    <label for="amount">후원할 금액 (KRW)</label>
    <input type="number" id="amount" value="5000" min="1000" step="1000" placeholder="금액 입력">
  </div>

  <div class="btn-container">
    <button id="pay-button" class="custom-apple-pay-btn">
      <span>Pay로 후원하기</span>
    </button>
  </div>

  <div class="notice" id="env-notice">
    상태 확인 중...
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const payButton = document.getElementById("pay-button");
      const envNotice = document.getElementById("env-notice");

      if (window.ApplePaySession && ApplePaySession.canMakePayments()) {
        envNotice.innerHTML = "✅ <b>현재 기기/브라우저는 Apple Pay 결제를 지원합니다.</b>";
        envNotice.style.color = "#00875a";
      } else {
        envNotice.innerHTML = "⚠️ <b>안내:</b> 데모 모드로 실행 중입니다.";
        envNotice.style.color = "#b93815";
      }

      payButton.addEventListener("click", onApplePayButtonClicked);
    });

    function onApplePayButtonClicked() {
      const amountInput = document.getElementById("amount").value;

      if (!amountInput || amountInput <= 0) {
        alert("올바른 후원 금액을 입력해주세요.");
        return;
      }

      const formattedAmount = Number(amountInput).toLocaleString();

      // Apple Pay 구동 지원 환경인 경우 세션 처리
      if (window.ApplePaySession && ApplePaySession.canMakePayments()) {
        const paymentRequest = {
          countryCode: 'KR',
          currencyCode: 'KRW',
          supportedNetworks: ['visa', 'masterCard', 'amex'],
          merchantCapabilities: ['supports3DS'],
          total: {
            label: 'NFC Card Reader 후원금',
            amount: amountInput.toString()
          }
        };

        try {
          const session = new ApplePaySession(3, paymentRequest);

          session.onmerchantvalidation = (event) => {
            // 백엔드 인증서가 없는 데모 환경이므로 팝업창 시뮬레이션 완료
            setTimeout(() => {
              alert(`🎉 후원해 주셔서 감사합니다!\n\n결제 요청 금액: ${formattedAmount}원`);
            }, 300);
          };

          session.begin();
          return;

        } catch (e) {
          console.log("세션 생성 중 데모 예외 처리:", e);
        }
      }

      // 애플페이 지원 미환경이거나 예외 발생 시 데모 완료 팝업창 노출
      alert(`🎉 후원해 주셔서 감사합니다!\n\n후원 금액: ${formattedAmount}원\n(Apple Pay 데모 결제가 완료되었습니다.)`);
    }
  </script>
</body>
</html>
