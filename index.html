<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFC Card Reader - 프로젝트 후원하기</title>

  <!-- 토스페이먼츠 표준 SDK (에러 없이 가장 안정적인 방식) -->
  <script src="https://js.tosspayments.com/v1/payment"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 450px;
      margin: 40px auto;
      padding: 24px;
      background-color: #f5f5f7;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }
    h2 { margin-top: 0; color: #1d1d1f; font-size: 22px; }
    .input-group { margin: 20px 0; }
    label { display: block; font-size: 14px; color: #6e6e73; margin-bottom: 8px; font-weight: 500; }
    input {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      border: 1px solid #d2d2d7;
      border-radius: 10px;
      outline: none;
      background: #fff;
    }
    input:focus { border-color: #0071e3; }

    .submit-btn {
      width: 100%;
      height: 52px;
      margin-top: 15px;
      background-color: #0064FF;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }
    .submit-btn:hover { background-color: #0052cc; }
    .submit-btn:active { transform: scale(0.98); }

    .notice {
      margin-top: 20px;
      font-size: 13px;
      color: #86868b;
      line-height: 1.5;
      background: #ffffff;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #e5e5ea;
    }
  </style>
</head>
<body>

  <h2>프로젝트 후원하기</h2>
  
  <div class="input-group">
    <label for="amount">후원할 금액 (KRW)</label>
    <input type="number" id="amount" value="5000" min="1000" step="1000" placeholder="금액 입력">
  </div>

  <button id="payment-button" class="submit-btn">5,000원 후원 결제하기</button>

  <div class="notice">
    💡 Safari 브라우저에서 접속 시 결제창 내에서 <b>Apple Pay</b>를 선택하여 Face ID 결제를 진행할 수 있습니다.
  </div>

  <script>
    // 토스페이먼츠 범용 테스트 클라이언트 키
    const clientKey = "test_ck_D5148x91811e5m40A0a349R12482"; 
    const tossPayments = TossPayments(clientKey);

    document.addEventListener("DOMContentLoaded", () => {
      const amountInput = document.getElementById("amount");
      const paymentButton = document.getElementById("payment-button");

      // 실시간 금액 입력 반영
      amountInput.addEventListener("input", (e) => {
        const val = Number(e.target.value);
        if (val >= 1000) {
          paymentButton.innerText = `${val.toLocaleString()}원 후원 결제하기`;
        } else {
          paymentButton.innerText = `금액을 입력해주세요`;
        }
      });

      // 버튼 클릭 시 결제창 호출
      paymentButton.addEventListener("click", () => {
        const amount = Number(amountInput.value);

        if (!amount || amount < 1000) {
          alert("최소 후원 금액은 1,000원 이상입니다.");
          return;
        }

        // 토스 결제창 호출 (카드, 애플페이, 간편결제 통합창)
        tossPayments.requestPayment('카드', {
          amount: amount,
          orderId: "ORDER_" + Math.random().toString(36).substring(2, 12),
          orderName: "NFC Card Reader 프로젝트 후원",
          customerName: "후원자",
          successUrl: window.location.origin + window.location.pathname + "?status=success",
          failUrl: window.location.origin + window.location.pathname + "?status=fail",
        }).catch(function (error) {
          if (error.code !== 'USER_CANCEL') {
            alert("결제 에러: " + error.message);
          }
        });
      });

      // 결제 리다이렉트 처리 (감사 팝업창)
      checkPaymentResult();
    });

    function checkPaymentResult() {
      const urlParams = new URLSearchParams(window.location.search);
      const status = urlParams.get("status");

      if (status === "success") {
        const orderId = urlParams.get("orderId") || "";
        alert(`🎉 후원해 주셔서 진심으로 감사드립니다!\n\n결제가 성공적으로 요청되었습니다.\n(주문번호: ${orderId})`);
        // URL 파라미터 깔끔하게 정리
        window.history.replaceState({}, document.title, window.location.pathname);
      } else if (status === "fail") {
        const message = urlParams.get("message") || "결제가 취소되었습니다.";
        alert(`❌ 결제 취소/실패: ${message}`);
        window.history.replaceState({}, document.title, window.location.pathname);
      }
    }
  </script>
</body>
</html>
