<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFC Card Reader - 후원하기</title>

  <!-- 토스페이먼츠 최신 SDK v2 -->
  <script src="https://js.tosspayments.com/v2/standard"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 500px;
      margin: 30px auto;
      padding: 24px;
      background-color: #f5f5f7;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }
    h2 { margin-top: 0; color: #1d1d1f; font-size: 22px; }
    .input-group { margin: 20px 0; }
    label { display: block; font-size: 14px; color: #6e6e73; margin-bottom: 8px; font-weight: 500; }
    input {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      border: 1px solid #d2d2d7;
      border-radius: 10px;
      outline: none;
      background: #fff;
    }
    input:focus { border-color: #0071e3; }
    
    /* 토스 결제 UI 영역 */
    #payment-method { margin-top: 20px; }
    #agreement { margin-top: 10px; }

    .submit-btn {
      width: 100%;
      height: 52px;
      margin-top: 20px;
      background-color: #0064FF;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .submit-btn:hover { background-color: #0052cc; }
    .submit-btn:disabled { background-color: #b0c4de; cursor: not-allowed; }
  </style>
</head>
<body>

  <h2>프로젝트 후원하기</h2>
  
  <div class="input-group">
    <label for="amount">후원할 금액 (KRW)</label>
    <input type="number" id="amount" value="5000" min="1000" step="1000" placeholder="금액 입력">
  </div>

  <!-- 토스 결제 수단 선택 UI (Apple Pay, 카드 등 자동 렌더링) -->
  <div id="payment-method"></div>
  <div id="agreement"></div>

  <button id="payment-button" class="submit-btn" disabled>후원 결제하기</button>

  <script>
    // 토스페이먼츠 클라이언트 키 (테스트용)
    const clientKey = "test_ck_D5148x91811e5m40A0a349R12482"; 
    const customerKey = "USER_" + Math.random().toString(36).substring(2, 10);

    let widgets = null;
    let currentAmount = 5000;

    document.addEventListener("DOMContentLoaded", async () => {
      const amountInput = document.getElementById("amount");
      const paymentButton = document.getElementById("payment-button");

      // 1. 토스 위젯 초기화
      const tossPayments = TossPayments(clientKey);
      widgets = tossPayments.widgets({ customerKey });

      // 2. 초기 결제 금액 설정 및 위젯 렌더링
      await widgets.setAmount({
        currency: "KRW",
        value: currentAmount,
      });

      // 결제수단 UI (Apple Pay 버튼 포함) 및 약관 동의 UI 렌더링
      await Promise.all([
        widgets.renderPaymentMethods({
          selector: "#payment-method",
          variantKey: "DEFAULT",
        }),
        widgets.renderAgreement({
          selector: "#agreement",
          variantKey: "AGREEMENT",
        }),
      ]);

      // 위젯 렌더링 완료 후 버튼 활성화
      paymentButton.disabled = false;

      // 3. 금액 변경 시 토스 위젯 금액 실시간 업데이트
      amountInput.addEventListener("change", async (e) => {
        const val = Number(e.target.value);
        if (val >= 1000) {
          currentAmount = val;
          await widgets.setAmount({
            currency: "KRW",
            value: currentAmount,
          });
        }
      });

      // 4. 결제하기 버튼 클릭
      paymentButton.addEventListener("click", async () => {
        try {
          // 토스 결제창 호출 (Apple Pay 선택 시 Face ID / Touch ID 호출됨)
          await widgets.requestPayment({
            orderId: "ORDER_" + Math.random().toString(36).substring(2, 12),
            orderName: "NFC Card Reader 프로젝트 후원",
            successUrl: window.location.origin + window.location.pathname + "?status=success",
            failUrl: window.location.origin + window.location.pathname + "?status=fail",
          });
        } catch (error) {
          if (error.code !== "USER_CANCEL") {
            alert("결제 요청 중 오류가 발생했습니다: " + error.message);
          }
        }
      });

      // 5. 결제 후 돌아왔을 때 성공/실패 팝업 처리
      checkPaymentResult();
    });

    // 성공/실패 URL 파라미터 감지 후 감사 팝업창 띄우기
    function checkPaymentResult() {
      const urlParams = new URLSearchParams(window.location.search);
      const status = urlParams.get("status");

      if (status === "success") {
        const amount = urlParams.get("amount") || currentAmount;
        alert(`🎉 후원해 주셔서 진심으로 감사드립니다!\n\n결제 승인 금액: ${Number(amount).toLocaleString()}원`);
        // URL 정리
        window.history.replaceState({}, document.title, window.location.pathname);
      } else if (status === "fail") {
        const message = urlParams.get("message") || "결제가 취소되었거나 실패했습니다.";
        alert(`❌ 결제 실패: ${message}`);
        window.history.replaceState({}, document.title, window.location.pathname);
      }
    }
  </script>
</body>
</html>
