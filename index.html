<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>iPhone 계산기 (토스페이먼츠 연동)</title>
  
  <!-- 토스페이먼츠 SDK v1 -->
  <script id="toss-sdk" src="https://js.tosspayments.com/v1/payment-js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation; /* 더블 탭 확대 방지 */
    }

    body {
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    }

    /* 아이폰 계산기 프레임 */
    .calculator {
      width: 340px;
      height: 580px;
      background-color: #000000;
      padding: 20px 16px 24px;
      border-radius: 40px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      box-shadow: 0 20px 50px rgba(255, 255, 255, 0.08);
      position: relative;
    }

    /* 디스플레이 화면 */
    .display {
      color: #ffffff;
      font-size: 72px;
      font-weight: 300;
      text-align: right;
      padding: 0 12px 12px;
      word-break: break-all;
      line-height: 1.1;
      letter-spacing: -2px;
      transition: font-size 0.2s ease;
    }

    /* 버튼 그리드 */
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    /* 버튼 기본 스타일 */
    .btn {
      border: none;
      outline: none;
      height: 64px;
      border-radius: 50%;
      font-size: 28px;
      font-weight: 400;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: filter 0.15s ease, background-color 0.2s ease;
    }

    .btn:active {
      filter: brightness(130%);
    }

    .btn-light-gray { background-color: #a5a5a5; color: #000000; font-weight: 500; }
    .btn-dark-gray { background-color: #333333; color: #ffffff; }
    .btn-orange { background-color: #ff9f0a; color: #ffffff; font-size: 32px; }
    .btn-orange.active { background-color: #ffffff; color: #ff9f0a; }
    .btn-zero { grid-column: span 2; border-radius: 32px; justify-content: flex-start; padding-left: 26px; }
  </style>
</head>
<body>

  <div class="calculator">
    <div class="display" id="display">0</div>
    <div class="buttons">
      <button class="btn btn-light-gray" id="btn-clear" onclick="handleClear()">AC</button>
      <button class="btn btn-light-gray" onclick="toggleSign()">+/–</button>
      <button class="btn btn-light-gray" onclick="handlePercent()">%</button>
      <button class="btn btn-orange operator" onclick="setOperator('÷', this)">÷</button>

      <button class="btn btn-dark-gray" onclick="appendNumber('7')">7</button>
      <button class="btn btn-dark-gray" onclick="appendNumber('8')">8</button>
      <button class="btn btn-dark-gray" onclick="appendNumber('9')">9</button>
      <button class="btn btn-orange operator" onclick="setOperator('×', this)">×</button>

      <button class="btn btn-dark-gray" onclick="appendNumber('4')">4</button>
      <button class="btn btn-dark-gray" onclick="appendNumber('5')">5</button>
      <button class="btn btn-dark-gray" onclick="appendNumber('6')">6</button>
      <button class="btn btn-orange operator" onclick="setOperator('–', this)">–</button>

      <button class="btn btn-dark-gray" onclick="appendNumber('1')">1</button>
      <button class="btn btn-dark-gray" onclick="appendNumber('2')">2</button>
      <button class="btn btn-dark-gray" onclick="appendNumber('3')">3</button>
      <button class="btn btn-orange operator" onclick="setOperator('+', this)">+</button>

      <button class="btn btn-dark-gray btn-zero" onclick="appendNumber('0')">0</button>
      <button class="btn btn-dark-gray" onclick="appendDecimal()">.</button>
      <button class="btn btn-orange" onclick="onEqualPressed()">=</button>
    </div>
  </div>

  <script>
    let currentInput = '0';
    let previousInput = null;
    let selectedOperator = null;
    let waitingForNextInput = false;

    const displayElement = document.getElementById('display');
    const clearBtn = document.getElementById('btn-clear');
    const clientKey = "test_ck_D5148x91811e5m40A0a349R12482";

    window.addEventListener('load', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const isSuccess = urlParams.get('paymentSuccess');
      const savedResult = localStorage.getItem('calc_result');

      if (isSuccess === 'true' && savedResult !== null) {
        currentInput = savedResult;
        localStorage.removeItem('calc_result');
        window.history.replaceState({}, document.title, window.location.pathname);
        updateDisplay();
      }
    });

    function updateDisplay() {
      let formatted = currentInput;
      if (currentInput !== 'Error') {
        const parts = currentInput.split('.');
        parts[0] = Number(parts[0]).toLocaleString('en-US', { maximumFractionDigits: 10 });
        formatted = parts.join('.');
      }
      displayElement.textContent = formatted;

      const length = formatted.length;
      if (length > 8) displayElement.style.fontSize = '40px';
      else if (length > 6) displayElement.style.fontSize = '54px';
      else displayElement.style.fontSize = '72px';

      clearBtn.textContent = (currentInput !== '0' || previousInput !== null) ? 'C' : 'AC';
    }

    function appendNumber(number) {
      clearActiveOperators();
      if (waitingForNextInput) {
        currentInput = number;
        waitingForNextInput = false;
      } else {
        if (currentInput === '0') currentInput = number;
        else if (currentInput.replace(/[^0-9]/g, '').length < 9) currentInput += number;
      }
      updateDisplay();
    }

    function appendDecimal() {
      clearActiveOperators();
      if (waitingForNextInput) {
        currentInput = '0.';
        waitingForNextInput = false;
      } else if (!currentInput.includes('.')) {
        currentInput += '.';
      }
      updateDisplay();
    }

    function handleClear() {
      currentInput = '0';
      if (clearBtn.textContent === 'AC') {
        previousInput = null;
        selectedOperator = null;
      }
      clearActiveOperators();
      updateDisplay();
    }

    function toggleSign() {
      if (currentInput !== '0' && currentInput !== 'Error') {
        currentInput = (parseFloat(currentInput) * -1).toString();
        updateDisplay();
      }
    }

    function handlePercent() {
      if (currentInput !== 'Error') {
        currentInput = (parseFloat(currentInput) / 100).toString();
        updateDisplay();
      }
    }

    function setOperator(op, element) {
      if (selectedOperator && !waitingForNextInput) calculateInternal();
      previousInput = currentInput;
      selectedOperator = op;
      waitingForNextInput = true;
      clearActiveOperators();
      element.classList.add('active');
    }

    function calculateInternal() {
      if (!selectedOperator || previousInput === null) return currentInput;
      const prev = parseFloat(previousInput);
      const current = parseFloat(currentInput);
      let result = 0;

      switch (selectedOperator) {
        case '+': result = prev + current; break;
        case '–': result = prev - current; break;
        case '×': result = prev * current; break;
        case '÷': result = current === 0 ? 'Error' : prev / current; break;
      }

      selectedOperator = null;
      previousInput = null;
      waitingForNextInput = true;
      return result.toString();
    }

    function clearActiveOperators() {
      document.querySelectorAll('.operator').forEach(btn => btn.classList.remove('active'));
    }

    // 동적 스크립트 로드 함수
    function ensureSdkLoaded() {
      return new Promise((resolve, reject) => {
        if (typeof TossPayments !== 'undefined') {
          resolve();
          return;
        }

        const script = document.createElement('script');
        script.src = "https://js.tosspayments.com/v1/payment-js";
        script.onload = () => resolve();
        script.onerror = () => reject(new Error("토스페이먼츠 CDN 접속 실패. 광고 차단 프로그램(AdBlock)을 해제했는지 확인해 주세요."));
        document.head.appendChild(script);
      });
    }

    async function onEqualPressed() {
      if (!selectedOperator || previousInput === null) return;

      const pendingResult = calculateInternal();
      localStorage.setItem('calc_result', pendingResult);
      clearActiveOperators();

      try {
        // SDK 로딩 동적 체크
        await ensureSdkLoaded();

        const tossPayments = TossPayments(clientKey);
        const currentUrl = window.location.href.split('?')[0];
        const randomOrderId = "ORDER_" + Date.now() + "_" + Math.floor(Math.random() * 1000);

        tossPayments.requestPayment('카드', {
          amount: 999000,
          orderId: randomOrderId,
          orderName: '계산 결과 열람 권한 (999,000원)',
          customerName: '사용자',
          successUrl: currentUrl + '?paymentSuccess=true',
          failUrl: currentUrl + '?paymentSuccess=false',
        }).catch(function (error) {
          if (error.code !== 'USER_CANCEL') {
            alert('결제 오류: ' + error.message);
          }
        });
      } catch (e) {
        alert(e.message);
      }
    }
  </script>
</body>
</html>
