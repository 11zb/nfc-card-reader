<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFC Card Reader - 후원하기</title>

  <!-- 토스페이먼츠 최신 SDK v2 -->
  <script src="https://js.tosspayments.com/v2/standard"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 500px;
      margin: 30px auto;
      padding: 24px;
      background-color: #f5f5f7;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }
    h2 { margin-top: 0; color: #1d1d1f; font-size: 22px; }
    .input-group { margin: 20px 0; }
    label { display: block; font-size: 14px; color: #6e6e73; margin-bottom: 8px; font-weight: 500; }
    input {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      border: 1px solid #d2d2d7;
      border-radius: 10px;
      outline: none;
      background: #fff;
    }
    input:focus { border-color: #0071e3; }
    
    #payment-method { margin-top: 20px; min-height: 200px; }
    #agreement { margin-top: 10px; min-height: 100px; }

    .submit-btn {
      width: 100%;
      height: 52px;
      margin-top: 20px;
      background-color: #0064FF;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .submit-btn:hover { background-color: #0052cc; }
    .submit-btn:disabled { 
      background-color: #e5e5ea !important; 
      color: #86868b !important;
      cursor: not-allowed !important; 
    }
  </style>
</head>
<body>

  <h2>프로젝트 후원하기</h2>
  
  <div class="input-group">
    <label for="amount">후원할 금액 (KRW)</label>
    <input type="number" id="amount" value="5000" min="1000" step="1000" placeholder="금액 입력">
  </div>

  <!-- 결제위젯 영역 -->
  <div id="payment-method"></div>
  <div id="agreement"></div>

  <button id="payment-button" class="submit-btn" disabled>로딩 중...</button>

  <script>
    // 토스페이먼츠 공식 문서용 공식 테스트 키 적용 완료
    const clientKey = "test_gck_docs_Ovk5rk1EwkEbP0W43n07xlzm"; 
    const customerKey = "USER_" + Math.random().toString(36).substring(2, 10);

    let widgets = null;
    let currentAmount = 5000;

    document.addEventListener("DOMContentLoaded", async () => {
      const amountInput = document.getElementById("amount");
      const paymentButton = document.getElementById("payment-button");

      try {
        // 1. SDK 초기화
        const tossPayments = TossPayments(clientKey);
        widgets = tossPayments.widgets({ customerKey });

        // 2. 금액 설정
        await widgets.setAmount({
          currency: "KRW",
          value: currentAmount,
        });

        // 3. 결제 UI & 약관 UI 렌더링
        await Promise.all([
          widgets.renderPaymentMethods({
            selector: "#payment-method",
            variantKey: "DEFAULT",
          }),
          widgets.renderAgreement({
            selector: "#agreement",
            variantKey: "AGREEMENT",
          }),
        ]);

        // 4. 로딩 완료 시 버튼 활성화
        paymentButton.disabled = false;
        paymentButton.innerText = `${currentAmount.toLocaleString()}원 후원 결제하기`;

      } catch (error) {
        console.error("위젯 초기화 에러:", error);
        document.getElementById("payment-method").innerHTML = 
          `<p style="color:red; font-size:14px;">결제 모듈을 불러오지 못했습니다.<br>(${error.message})</p>`;
      }

      // 금액 입력 변경 시 실시간 반영
      amountInput.addEventListener("input", async (e) => {
        const val = Number(e.target.value);
        if (val >= 1000) {
          currentAmount = val;
          paymentButton.innerText = `${currentAmount.toLocaleString()}원 후원 결제하기`;
          if (widgets) {
            await widgets.setAmount({
              currency: "KRW",
              value: currentAmount,
            });
          }
        }
      });

      // 결제 버튼 클릭시 결제창 팝업
      paymentButton.addEventListener("click", async () => {
        if (!widgets) return;

        try {
          await widgets.requestPayment({
            orderId: "ORDER_" + Math.random().toString(36).substring(2, 12),
            orderName: "NFC Card Reader 프로젝트 후원",
            successUrl: window.location.origin + window.location.pathname + "?status=success",
            failUrl: window.location.origin + window.location.pathname + "?status=fail",
          });
        } catch (error) {
          if (error.code !== "USER_CANCEL") {
            alert("결제 실패: " + error.message);
          }
        }
      });

      checkPaymentResult();
    });

    // 결제 리다이렉트 후 감사 팝업
    function checkPaymentResult() {
      const urlParams = new URLSearchParams(window.location.search);
      const status = urlParams.get("status");

      if (status === "success") {
        alert("🎉 후원해 주셔서 진심으로 감사드립니다!\n\n결제가 성공적으로 요청되었습니다.");
        window.history.replaceState({}, document.title, window.location.pathname);
      } else if (status === "fail") {
        const message = urlParams.get("message") || "결제가 취소되었습니다.";
        alert(`❌ 결제 취소/실패: ${message}`);
        window.history.replaceState({}, document.title, window.location.pathname);
      }
    }
  </script>
</body>
</html>
